/* =====================================================================
   REPAIR BAY — the fixing is now a game, not a purchase.
   Bolts physically fly from the counter into the part; the child taps
   each glowing bolt hole to fasten it. This is the causal link that was
   missing: bolts -> fastening -> the part is on.
=======================================================================*/
/* =====================================================================
   SEA CREATURE ART — shared by SALVAGE DIVE
=======================================================================*/
function drawCreature(kind, x, y, r, color, t, lit){
  ctx.save(); ctx.translate(x,y);
  const glow = lit? 1 : 0;
  if(glow){ ctx.shadowColor=color; ctx.shadowBlur=28; }
  ctx.fillStyle = lit? color : "#2a3d59";
  ctx.strokeStyle = lit? color : "#3c5274";
  ctx.lineWidth = 3;
  const bob = Math.sin(t*2 + x*0.01)*r*0.06;
  ctx.translate(0,bob);
  if(kind==="fish"){
    ctx.beginPath(); ctx.ellipse(0,0,r,r*0.62,0,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.moveTo(r*0.85,0); ctx.lineTo(r*1.5,-r*0.55);
    ctx.lineTo(r*1.5,r*0.55); ctx.closePath(); ctx.fill();
    ctx.fillStyle= lit? "#0b1424":"#16233a";
    ctx.beginPath(); ctx.arc(-r*0.45,-r*0.14,r*0.15,0,TAU); ctx.fill();
  }else if(kind==="crab"){
    ctx.beginPath(); ctx.ellipse(0,0,r,r*0.72,0,0,TAU); ctx.fill();
    for(const sgn of [-1,1]){
      ctx.beginPath(); ctx.ellipse(sgn*r*1.25,-r*0.35,r*0.42,r*0.30,sgn*0.5,0,TAU); ctx.fill();
      ctx.lineWidth=4; ctx.strokeStyle=ctx.fillStyle;
      for(let i=0;i<3;i++){
        ctx.beginPath(); ctx.moveTo(sgn*r*0.7, r*0.2+i*r*0.24);
        ctx.lineTo(sgn*r*1.25, r*0.5+i*r*0.26); ctx.stroke();
      }
    }
    ctx.fillStyle= lit? "#0b1424":"#16233a";
    ctx.beginPath(); ctx.arc(-r*0.3,-r*0.25,r*0.14,0,TAU);
    ctx.arc(r*0.3,-r*0.25,r*0.14,0,TAU); ctx.fill();
  }else if(kind==="octo"){
    ctx.beginPath(); ctx.arc(0,-r*0.1,r*0.85,Math.PI,0); ctx.fill();
    ctx.fillRect(-r*0.85,-r*0.1,r*1.7,r*0.35);
    for(let i=0;i<5;i++){
      const tx0=-r*0.7+i*r*0.35;
      const wig=Math.sin(t*3+i)*r*0.16;
      ctx.beginPath(); ctx.moveTo(tx0,r*0.2);
      ctx.quadraticCurveTo(tx0+wig, r*0.6, tx0+wig*0.5, r*0.95);
      ctx.lineWidth=r*0.2; ctx.strokeStyle=ctx.fillStyle; ctx.lineCap="round"; ctx.stroke();
    }
    ctx.fillStyle= lit? "#0b1424":"#16233a";
    ctx.beginPath(); ctx.arc(-r*0.3,-r*0.35,r*0.15,0,TAU);
    ctx.arc(r*0.3,-r*0.35,r*0.15,0,TAU); ctx.fill();
  }else if(kind==="turtle"){
    ctx.beginPath(); ctx.ellipse(0,0,r,r*0.78,0,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-r*1.05,-r*0.1,r*0.34,r*0.28,0,0,TAU); ctx.fill();
    for(const p of [[-0.75,0.6],[0.75,0.6],[-0.8,-0.5],[0.8,-0.5]]){
      ctx.beginPath(); ctx.ellipse(p[0]*r,p[1]*r,r*0.26,r*0.18,0,0,TAU); ctx.fill();
    }
    ctx.strokeStyle= lit? "#0b1424":"#16233a"; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(0,0,r*0.55,0,TAU); ctx.stroke();
    for(let i=0;i<3;i++){ const a=i*TAU/3;
      ctx.beginPath(); ctx.moveTo(Math.cos(a)*r*0.55,Math.sin(a)*r*0.55);
      ctx.lineTo(Math.cos(a)*r*0.95,Math.sin(a)*r*0.78); ctx.stroke(); }
  }else{ // jelly
    ctx.beginPath(); ctx.arc(0,0,r*0.85,Math.PI,0); ctx.fill();
    ctx.fillRect(-r*0.85,0,r*1.7,r*0.18);
    for(let i=0;i<4;i++){
      const tx0=-r*0.6+i*r*0.4;
      const wig=Math.sin(t*3.4+i*1.3)*r*0.2;
      ctx.beginPath(); ctx.moveTo(tx0,r*0.18);
      ctx.quadraticCurveTo(tx0+wig, r*0.7, tx0-wig*0.4, r*1.15);
      ctx.lineWidth=r*0.13; ctx.strokeStyle=ctx.fillStyle; ctx.lineCap="round"; ctx.stroke();
    }
    ctx.fillStyle= lit? "#0b1424":"#16233a";
    ctx.beginPath(); ctx.arc(-r*0.28,-r*0.3,r*0.13,0,TAU);
    ctx.arc(r*0.28,-r*0.3,r*0.13,0,TAU); ctx.fill();
  }
  ctx.restore();
}

/* =====================================================================
   SALVAGE DIVE — sonar memory (working memory / sequencing)
   Titan's lost parts are on the seabed. The sonar pings a pattern of
   sea creatures; repeat it to bring up the salvage. Self-paced on
   purpose: it's the one mission with no clock, which makes it a
   different kind of attention practice than the timed games.
=======================================================================*/
const CREATURES = [
  {kind:"fish",   color:COL.cyan,   tone:392},
  {kind:"crab",   color:COL.red,    tone:523},
  {kind:"octo",   color:COL.purple, tone:659},
  {kind:"turtle", color:COL.lime,   tone:784},
  {kind:"jelly",  color:COL.yellow, tone:988}
];
scenes.sonar = {
  enter(){
    this.t=0; this.level=S.lv.sonar;
    this.n = clamp(3 + Math.floor((this.level-1)/3), 3, CREATURES.length);
    this.seq=[]; this.step=0; this.playIdx=-1; this.playT=0;
    this.mode="show"; this.shields=CONFIG.shields;
    this.round=0; this.best=0; this.over=false; this.result=null;
    this.started=!!S.seen.sonar;
    this.flash=-1; this.flashT=0; this.wrongT=0;
    this.bubbles=[];
    for(let i=0;i<26;i++)
      this.bubbles.push({x:rand(0,W), y:rand(0,H), r:rand(2,7), sp:rand(18,50)});
    this.nextRound();
  },
  nextRound(){
    this.round++;
    this.seq.push(ri(0,this.n-1));
    this.step=0; this.mode="show"; this.playIdx=-1; this.playT=0.7;
  },
  slots(){
    const arr=[];
    const land = W>H;
    const cols = this.n;
    const areaW = Math.min(W*0.92, 620);
    const cw = areaW/cols;
    const r = Math.min(cw*0.34, H*0.11);
    const cy = land? H*0.60 : H*0.56;
    for(let i=0;i<cols;i++)
      arr.push({x:W/2-areaW/2+cw*(i+0.5), y:cy, r});
    return arr;
  },
  ping(i, dur){
    this.flash=i; this.flashT=dur||0.42;
    const c=CREATURES[i];
    tone(c.tone, 0.26, "sine", 0.16);
    const sl=this.slots()[i];
    burst(sl.x, sl.y, c.color, 8, 160, 0.4);
  },
  onDown(p){
    if(!this.started || this.over || this.mode!=="input") return;
    const sl=this.slots();
    for(let i=0;i<sl.length;i++){
      if(Math.hypot(p.x-sl[i].x, p.y-sl[i].y) < sl[i].r*1.35){
        this.ping(i, 0.3);
        if(this.seq[this.step]===i){
          this.step++;
          if(this.step>=this.seq.length){
            this.best=Math.max(this.best,this.seq.length);
            this.mode="good"; this.playT=0.7;
            sfx.win();
            floatText("SALVAGE UP! +"+this.seq.length, W/2, H*0.30, COL.lime, 28);
          }
        }else{
          this.shields--; this.wrongT=0.6; sfx.wrong(); addShake(8);
          floatText("SONAR LOST!", W/2, H*0.30, COL.red, 26);
          if(this.shields<=0){ this.finish(); }
          else{ this.mode="replay"; this.playT=0.9; this.step=0; }
        }
        return;
      }
    }
  },
  finish(){
    if(this.over) return;
    this.over=true;
    const b=awardBolts(4 + this.best*3 + (this.round-1)*2);
    levelUp("sonar");
    this.result={b};
    sfx.win();
  },
  draw(dt){
    this.t+=dt;
    // ---- underwater background
    ctx.fillStyle="#071a2b"; ctx.fillRect(0,0,W,H);
    ctx.fillStyle="rgba(53,224,255,0.05)";
    for(let i=0;i<5;i++){
      const y=(this.t*12+i*90)%(H+120)-60;
      ctx.fillRect(0,y,W,26);
    }
    for(const b of this.bubbles){
      b.y-=b.sp*dt; if(b.y< -10){ b.y=H+10; b.x=rand(0,W); }
      ctx.globalAlpha=0.25; ctx.strokeStyle=COL.cyan; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,TAU); ctx.stroke();
    }
    ctx.globalAlpha=1;
    // seabed
    ctx.fillStyle="#0a2438";
    ctx.beginPath(); ctx.moveTo(0,H);
    for(let x=0;x<=W;x+=50) ctx.lineTo(x, H*0.80+Math.sin(x*0.01)*14);
    ctx.lineTo(W,H); ctx.closePath(); ctx.fill();

    if(!this.started){
      hintOverlay("sonar", this.t, (t)=>{
        txt("WATCH THE SONAR", W/2, H*0.16, Math.min(32,W*0.075), COL.text);
        txt("THEN TAP THE SAME ORDER", W/2, H*0.24, Math.min(20,W*0.05), COL.cyan);
        const ph=Math.floor((t*1.4)%3);
        for(let i=0;i<3;i++){
          const c=CREATURES[i];
          drawCreature(c.kind, W/2-110+i*110, H*0.46, 38, c.color, t, ph===i);
          txt(String(i+1), W/2-110+i*110, H*0.46+72, 22, ph===i? c.color : COL.dim);
        }
        txt("BRING UP TITAN'S LOST PARTS!", W/2, H*0.70, Math.min(19,W*0.048), COL.lime);
      }, ()=>{ this.started=true; });
      missionTop("SALVAGE DIVE", COL.cyan, null, this.shields);
      return;
    }

    // ---- state machine
    if(!this.over){
      this.playT-=dt;
      if(this.flashT>0) this.flashT-=dt; else this.flash=-1;
      if(this.wrongT>0) this.wrongT-=dt;
      if(this.mode==="show" || this.mode==="replay"){
        if(this.playT<=0){
          this.playIdx++;
          if(this.playIdx>=this.seq.length){
            this.mode="input"; this.step=0; this.playIdx=-1;
          }else{
            this.ping(this.seq[this.playIdx], 0.42);
            this.playT = clamp(0.72 - this.level*0.02, 0.42, 0.72);
          }
        }
      }else if(this.mode==="good"){
        if(this.playT<=0){
          if(this.seq.length >= 3 + this.level) this.finish();
          else this.nextRound();
        }
      }
    }

    // ---- creatures
    const sl=this.slots();
    for(let i=0;i<this.n;i++){
      const c=CREATURES[i];
      const lit = this.flash===i;
      // socket ring
      ctx.strokeStyle= lit? c.color : "rgba(53,224,255,0.18)";
      ctx.lineWidth= lit? 4:2;
      ctx.beginPath(); ctx.arc(sl[i].x, sl[i].y, sl[i].r*1.32, 0, TAU); ctx.stroke();
      drawCreature(c.kind, sl[i].x, sl[i].y, sl[i].r, c.color, this.t, lit);
    }

    updateFx(dt); drawFx();

    // ---- HUD
    const label = this.mode==="input" ? "YOUR TURN!" :
                  this.mode==="good"  ? "GOT IT!" : "WATCH...";
    txt(label, W/2, H*0.16, Math.min(30,W*0.07),
        this.mode==="input"? COL.lime : COL.cyan);
    // progress pips for the current sequence
    const pipR=7, gapP=20, totalP=this.seq.length*gapP;
    for(let i=0;i<this.seq.length;i++){
      const px=W/2-totalP/2+gapP*(i+0.5), py=H*0.16+Math.min(38,W*0.09);
      ctx.fillStyle = (this.mode==="input" && i<this.step)? COL.lime
                    : (this.mode!=="input" && i<=this.playIdx)? COL.cyan
                    : "rgba(138,163,196,0.3)";
      ctx.beginPath(); ctx.arc(px,py,pipR,0,TAU); ctx.fill();
    }
    txt("DEPTH "+this.round, W/2, H*0.16+Math.min(64,W*0.15), 16, COL.dim);
    missionTop("SALVAGE DIVE", COL.cyan, null, this.shields);
    if(this.over && this.result){
      drawResult("SALVAGE DONE!", ["LONGEST SONAR: "+this.best,
        "DEPTH REACHED: "+this.round], this.result.b, "sonar");
    }
  }
};

/* =====================================================================
   REACTOR LAB — simple math (counting, then addition within 10)
   Titan's reactor needs a fuse with the right value. Quantities are
   always shown as countable dots AND a numeral, so a child who can't
   yet read numerals can still count their way to the answer.
=======================================================================*/
function drawDots(n, cx, cy, cell, color){
  // arrange up to 10 dots in two tidy rows (five-frame layout, easy to subitize)
  const top=Math.min(n,5), bot=Math.max(0,n-5);
  const r=cell*0.30;
  for(let i=0;i<top;i++){
    ctx.fillStyle=color;
    ctx.beginPath(); ctx.arc(cx-(top-1)*cell/2+i*cell, cy-(bot?cell*0.42:0), r, 0, TAU); ctx.fill();
  }
  for(let i=0;i<bot;i++){
    ctx.fillStyle=color;
    ctx.beginPath(); ctx.arc(cx-(bot-1)*cell/2+i*cell, cy+cell*0.42, r, 0, TAU); ctx.fill();
  }
}
scenes.circuit = {
  enter(){
    this.t=0; this.level=S.lv.circuit;
    this.timeLeft=CONFIG.roundSeconds; this.shields=CONFIG.shields;
    this.solved=0; this.streak=0; this.over=false; this.result=null;
    this.started=!!S.seen.circuit;
    this.feed=0; this.feedGood=false; this.charge=0;
    this.newProblem();
  },
  newProblem(){
    const lv=this.level;
    let a,b,ans,kind;
    if(lv<=2){ kind="count"; ans=ri(1,5); a=ans; b=0; }
    else if(lv<=4){ kind="count"; ans=ri(3,9); a=ans; b=0; }
    else if(lv<=7){ kind="add"; a=ri(1,3); b=ri(1,3); ans=a+b; }
    else { kind="add"; a=ri(1,5); b=ri(1,5); ans=a+b; }
    this.kind=kind; this.a=a; this.b=b; this.ans=ans;
    // three options, all plausible and distinct
    const opts=new Set([ans]);
    let guard=0;
    while(opts.size<3 && guard++<50){
      const d=pick([-2,-1,1,2]);
      const v=ans+d;
      if(v>=1 && v<=10) opts.add(v);
    }
    while(opts.size<3) opts.add(ri(1,10));
    this.opts=Array.from(opts).sort(()=>Math.random()-0.5);
  },
  fuseRects(){
    const n=this.opts.length;
    const land=W>H;
    const fw=Math.min(land? W*0.20 : W*0.26, 150);
    const fh=Math.min(H*0.20, 150);
    const gap=Math.min(W*0.04, 26);
    const total=n*fw+(n-1)*gap;
    const y=land? H*0.62 : H*0.66;
    return this.opts.map((v,i)=>({v, x:W/2-total/2+i*(fw+gap), y, w:fw, h:fh}));
  },
  onDown(p){
    if(!this.started || this.over || this.feed>0) return;
    for(const f of this.fuseRects()){
      if(p.x>=f.x && p.x<=f.x+f.w && p.y>=f.y && p.y<=f.y+f.h){
        if(f.v===this.ans){
          this.solved++; this.streak++;
          this.charge=clamp(this.charge+1,0,5);
          this.feed=0.75; this.feedGood=true;
          sfx.coin(); sfx.place();
          burst(f.x+f.w/2, f.y+f.h/2, COL.lime, 16, 300, 0.6);
          floatText(this.streak>=3? "PERFECT x"+this.streak : "POWER FLOWS!",
                    W/2, H*0.30, COL.lime, this.streak>=3?30:24);
          if(this.charge>=5){
            this.charge=0;
            floatText("REACTOR SURGE! +5", W/2, H*0.24, COL.yellow, 28);
            this.solved+=2; sfx.fanfare();
          }
        }else{
          this.streak=0; this.shields--; this.feed=0.6; this.feedGood=false;
          sfx.wrong(); addShake(7);
          floatText("WRONG FUSE!", f.x+f.w/2, f.y-14, COL.red, 22);
          if(this.shields<=0) this.finish();
        }
        return;
      }
    }
  },
  finish(){
    if(this.over) return;
    this.over=true;
    const b=awardBolts(4 + this.solved*3);
    levelUp("circuit");
    this.result={b};
    sfx.win();
  },
  draw(dt){
    this.t+=dt;
    drawBg(dt);
    if(!this.started){
      hintOverlay("circuit", this.t, (t)=>{
        txt("COUNT THE POWER CELLS", W/2, H*0.15, Math.min(28,W*0.066), COL.text);
        txt("PICK THE MATCHING FUSE", W/2, H*0.23, Math.min(20,W*0.05), COL.cyan);
        drawDots(3, W/2, H*0.38, Math.min(46,W*0.11), COL.cyan);
        const ph=Math.floor(t*1.2)%3;
        for(let i=0;i<3;i++){
          const x=W/2-110+i*110, val=[2,3,4][i];
          ctx.fillStyle= (val===3 && ph===1)? "#173a1f" : COL.panel;
          rrect(x-42,H*0.52,84,84,14); ctx.fill();
          ctx.strokeStyle= (val===3 && ph===1)? COL.lime : COL.line;
          ctx.lineWidth=3; ctx.stroke();
          txt(String(val), x, H*0.52+42, 40, COL.text);
        }
        txt("THE FUSE POWERS TITAN!", W/2, H*0.74, Math.min(19,W*0.048), COL.lime);
      }, ()=>{ this.started=true; });
      missionTop("REACTOR LAB", COL.purple, this.timeLeft, this.shields);
      return;
    }
    if(!this.over){
      this.timeLeft-=dt;
      if(this.timeLeft<=0) this.finish();
      if(this.feed>0){
        this.feed-=dt;
        if(this.feed<=0 && this.feedGood) this.newProblem();
      }
    }
    // ---- the reactor gap: quantities shown as dots + numerals
    const cell=Math.min(44, W*0.10);
    const py=H*0.30;
    if(this.kind==="count"){
      drawDots(this.a, W/2, py, cell, COL.cyan);
      txt("HOW MANY?", W/2, py-Math.min(74,H*0.11), Math.min(24,W*0.058), COL.text);
    }else{
      const half=Math.min(W*0.24, 150);
      drawDots(this.a, W/2-half, py, cell*0.8, COL.cyan);
      drawDots(this.b, W/2+half, py, cell*0.8, COL.orange);
      txt("+", W/2, py, Math.min(42,W*0.1), COL.text);
      txt("HOW MANY ALTOGETHER?", W/2, py-Math.min(74,H*0.11), Math.min(22,W*0.052), COL.text);
      // numerals under each group reinforce the symbol
      txt(String(this.a), W/2-half, py+Math.min(52,H*0.08), 22, COL.cyan);
      txt(String(this.b), W/2+half, py+Math.min(52,H*0.08), 22, COL.orange);
    }
    // ---- charge meter (5 correct = surge)
    const mw=Math.min(200,W*0.5);
    ctx.fillStyle=COL.panel; rrect(W/2-mw/2, H*0.44, mw, 16, 8); ctx.fill();
    ctx.fillStyle=COL.yellow;
    rrect(W/2-mw/2+2, H*0.44+2, Math.max(2,(mw-4)*(this.charge/5)), 12, 6); ctx.fill();
    txt("REACTOR "+this.charge+" / 5", W/2, H*0.44+8, 11, COL.bg);
    // ---- fuses
    for(const f of this.fuseRects()){
      const good = this.feed>0 && this.feedGood && f.v===this.ans;
      ctx.fillStyle= good? "#173a1f" : COL.panel;
      rrect(f.x,f.y,f.w,f.h,16); ctx.fill();
      ctx.strokeStyle= good? COL.lime : COL.line; ctx.lineWidth=3; ctx.stroke();
      // fuse body
      ctx.fillStyle="#22344f"; rrect(f.x+f.w*0.2, f.y+f.h*0.12, f.w*0.6, f.h*0.24, 6); ctx.fill();
      txt(String(f.v), f.x+f.w/2, f.y+f.h*0.58, Math.min(46,f.w*0.42), COL.text);
      drawDots(f.v, f.x+f.w/2, f.y+f.h*0.86, Math.min(13, f.w*0.13), COL.dim);
    }
    updateFx(dt); drawFx();
    txt("SOLVED: "+this.solved, W/2, H*0.20, 17, COL.lime);
    missionTop("REACTOR LAB", COL.purple, this.timeLeft, this.shields);
    if(this.over && this.result){
      drawResult("REACTOR ONLINE!", ["SOLVED: "+this.solved], this.result.b, "circuit");
    }
  }
};

scenes.repair = {
  enter(){
    this.t=0; this.done=false; this.exitT=0;
    this.idx = S.parts;
    this.cost = PARTS[this.idx] ? PARTS[this.idx].cost : 0;
    this.name = PARTS[this.idx] ? PARTS[this.idx].name : "";
    // 4-6 bolts to fasten, more for later (bigger) parts
    const n = clamp(4 + Math.floor(this.idx/3), 4, 6);
    this.bolts=[];
    for(let i=0;i<n;i++){
      const a = -Math.PI/2 + i*TAU/n;
      this.bolts.push({a, r:0, done:false, spin:0, pop:0});
    }
    this.flyers=[];   // bolts flying in from the counter
    this.spent=false;
    this.charge=0;
  },
  layout(){
    const cx=W/2, cy=H*0.46;
    const rad=Math.min(W*0.30, H*0.20);
    for(const b of this.bolts){
      b.x = cx + Math.cos(b.a)*rad;
      b.y = cy + Math.sin(b.a)*rad;
    }
    return {cx, cy, rad};
  },
  onDown(p){
    if(this.done) return;
    const L=this.layout();
    const hitR = Math.max(38, Math.min(W,H)*0.075);
    for(const b of this.bolts){
      if(b.done) continue;
      if(Math.hypot(p.x-b.x, p.y-b.y) < hitR){
        b.done=true; b.pop=1;
        sfx.place(); tone(300+this.bolts.filter(x=>x.done).length*90, 0.1, "square", 0.14, 120);
        burst(b.x, b.y, COL.orange, 12, 240, 0.5);
        addShake(3);
        // a bolt flies from the counter into this hole
        this.flyers.push({x:W-140, y:29, tx:b.x, ty:b.y, t:0});
        const left=this.bolts.filter(x=>!x.done).length;
        if(left===0) this.finish();
        return;
      }
    }
  },
  finish(){
    this.done=true; this.exitT=0;
    if(!this.spent){
      this.spent=true;
      S.bolts -= this.cost;
      S.parts++;
      save();
    }
    sfx.install(); addShake(9);
    burst(W/2, H*0.46, PAINTS[S.paint].glow, 40, 420, 1);
    floatText(this.name+" ONLINE!", W/2, H*0.30, COL.lime, 30);
  },
  draw(dt){
    this.t+=dt;
    drawBg(dt);
    const L=this.layout();
    const P=PAINTS[S.paint];

    missionTop("REPAIR BAY", COL.lime, null, null);

    // counter of bolts being spent
    const remaining = this.spent? S.bolts : S.bolts - this.cost;
    ctx.fillStyle=COL.panel; rrect(W-190,10,180,38,19); ctx.fill();
    ctx.strokeStyle=COL.line; ctx.lineWidth=2; ctx.stroke();
    drawBoltIcon(W-166,29,11);
    txt((this.spent? S.bolts : S.bolts)+" − "+this.cost, W-20, 29, 18, COL.orange, "right");

    const doneN = this.bolts.filter(b=>b.done).length;
    txt(this.done? "REPAIRED!" : "TAP THE GLOWING BOLTS",
        W/2, H*0.16, Math.min(28,W*0.065), this.done? COL.lime : COL.text);
    txt(this.name, W/2, H*0.16+Math.min(34,W*0.08), Math.min(20,W*0.05), COL.cyan);

    // the part being repaired, drawn large in the middle
    ctx.save();
    ctx.translate(L.cx, L.cy);
    const ps = Math.min(W*0.5, H*0.30)/120;
    ctx.scale(ps, ps);
    ctx.fillStyle= this.done? P.main : "rgba(53,224,255,0.10)";
    ctx.strokeStyle= this.done? P.dark : P.main;
    ctx.lineWidth=4/ps;
    if(!this.done){ ctx.setLineDash([10/ps,7/ps]); }
    rrect(-70,-46,140,92,14); ctx.fill(); ctx.stroke();
    ctx.setLineDash([]);
    if(this.done){
      ctx.fillStyle="rgba(255,255,255,0.2)";
      rrect(-60,-38,120,26,10); ctx.fill();
      ctx.save(); ctx.shadowColor=P.glow; ctx.shadowBlur=20;
      ctx.fillStyle=P.glow; ctx.beginPath(); ctx.arc(0,8,16,0,TAU); ctx.fill(); ctx.restore();
    }
    ctx.restore();

    // progress pips
    txt(doneN+" / "+this.bolts.length+" BOLTS", L.cx, L.cy+Math.min(W*0.5,H*0.30)*0.42+34,
        16, COL.dim);

    // bolt holes
    for(const b of this.bolts){
      if(b.pop>0) b.pop-=dt*3;
      const r = Math.max(15, Math.min(W,H)*0.032);
      if(b.done){
        b.spin += dt*6;
        ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.spin*0.4);
        drawBoltIcon(0,0, r*(1+Math.max(0,b.pop)*0.4), COL.orange);
        ctx.restore();
      }else{
        const pulse=0.55+0.45*Math.sin(this.t*5 + b.a*2);
        ctx.save();
        ctx.shadowColor=COL.cyan; ctx.shadowBlur=20*pulse;
        ctx.strokeStyle="rgba(53,224,255,"+(0.5+0.4*pulse).toFixed(2)+")";
        ctx.lineWidth=4;
        ctx.beginPath(); ctx.arc(b.x,b.y,r,0,TAU); ctx.stroke();
        ctx.restore();
        ctx.fillStyle="rgba(11,20,36,0.7)";
        ctx.beginPath(); ctx.arc(b.x,b.y,r*0.8,0,TAU); ctx.fill();
        // a little "tap here" dot
        ctx.fillStyle="rgba(53,224,255,"+(0.35+0.35*pulse).toFixed(2)+")";
        ctx.beginPath(); ctx.arc(b.x,b.y,r*0.28,0,TAU); ctx.fill();
      }
    }

    // flying bolts: the visible causal link between currency and repair
    for(const f of this.flyers){
      f.t+=dt*2.2;
      const e=ease(clamp(f.t,0,1));
      const fx=f.x+(f.tx-f.x)*e, fy=f.y+(f.ty-f.y)*e - Math.sin(e*Math.PI)*70;
      drawBoltIcon(fx,fy, 11, COL.orange);
    }
    this.flyers=this.flyers.filter(f=>f.t<1);

    updateFx(dt); drawFx();

    if(this.done){
      this.exitT+=dt;
      if(this.exitT>1.1){
        if(S.parts>=PARTS.length) go("victory"); else go("home");
        return;
      }
    }else{
      // back out without spending
      button(W/2-70, H*0.88, 140, 46, "LATER", ()=>go("home"), {stroke:COL.line, size:18});
    }
  }
};

scenes.victory = {

    const ts=Math.min(52,W*0.11);
    txt("TITAN", W/2, H*0.12, ts, COL.cyan, "center","900",true);
    txt("REBUILT!", W/2, H*0.12+ts*0.95, ts, COL.lime, "center","900",true);
    if(this.t>1.5){
      txt("NEW: PAINT SHOP + RANK UPS", W/2, H*0.80, Math.min(18,W*0.045), COL.yellow);
      const bw=Math.min(280,W*0.7);
      button(W/2-bw/2, H*0.86, bw, 62, "TO THE GARAGE", ()=>go("home"),
        {color:"#173a1f", stroke:COL.lime, glow:COL.lime});
    }
  }
};

/* =====================================================================
   PAINT SHOP
=======================================================================*/
scenes.paint = {
  enter(){ this.t=0; },
  draw(dt){
    this.t+=dt;
    drawBg(dt);
    missionTop("PAINT SHOP", COL.purple, null, null);
    const s=Math.min(W*0.5,H*0.45)/300;
    drawTitan(W/2, H*0.62, s, PARTS.length, this.t, false);
    txt("POWER UP TO UNLOCK MORE COLORS!", W/2, H*0.66, Math.min(15,W*0.04), COL.dim);
    const n=PAINTS.length;
    const unlocked = 1 + S.powerLv; // STORM free; each rank unlocks the next
    const bw=Math.min(150,(W-40)/n-10), bh=72;
    const total=n*bw+(n-1)*12;
    for(let i=0;i<n;i++){
      const p=PAINTS[i];
      const open = i<unlocked;
      const x=W/2-total/2+i*(bw+12), y=H*0.72;
      button(x,y,bw,bh,null,()=>{
        if(!open){ sfx.wrong(); floatText("REACH RANK "+i+" — "+rankName(i)+"!", W/2, H*0.55, COL.red, 24); return; }
        S.paint=i; save(); sfx.install();
        burst(W/2,H*0.4,p.glow,24,360);
      },
        {color: S.paint===i? "#22344f": COL.panel,
         stroke: S.paint===i? p.main : (open? COL.line : "#22304a"), r:16});
      ctx.fillStyle= open? p.main : "#3a4a5b";
      ctx.beginPath(); ctx.arc(x+bw/2, y+22, 14,0,TAU); ctx.fill();
      if(!open){
        // little lock
        ctx.strokeStyle="#8aa3c4"; ctx.lineWidth=3;
        ctx.strokeRect(x+bw/2-7, y+18, 14, 11);
        ctx.beginPath(); ctx.arc(x+bw/2, y+18, 5, Math.PI, 0); ctx.stroke();
        txt("RANK "+i, x+bw/2, y+bh-14, 12, COL.dim);
      }else{
        txt(p.name, x+bw/2, y+bh-14, 14, COL.text);
      }
    }
    updateFx(dt); drawFx();
  }
};

/* =====================================================================
   PARENT CORNER
=======================================================================*/
scenes.parent = {
  enter(){ this.confirm=0; },
  draw(dt){
    drawBg(dt);
    missionTop("GROWN-UP CORNER", COL.dim, null, null);
    const pw=Math.min(380,W*0.9), px=W/2-pw/2;
    let y=H*0.2;
    txt("Missions earn bolts. Bolts rebuild Titan.", W/2, y, 17, COL.text); y+=26;
    txt("Rounds last "+CONFIG.roundSeconds+"s. No internet needed.", W/2, y, 15, COL.dim); y+=40;
    button(px, y, pw, 54, S.snd? "SOUND EFFECTS: ON":"SOUND EFFECTS: OFF", ()=>{S.snd=!S.snd; save();}); y+=64;
    button(px, y, pw, 56,
      this.confirm? "TAP AGAIN TO ERASE ALL PROGRESS":"RESET PROGRESS",
      ()=>{
        if(this.confirm){ S=defaultSave(); save(); go("intro"); }
        else { this.confirm=1; }
      }, {stroke:this.confirm?COL.red:COL.line, textColor:this.confirm?COL.red:COL.text, size:18});
    y+=70;
    button(px, y, pw, 56, "BACK TO GAME", ()=>go("home"), {stroke:COL.cyan});
  }
};

/* ---------------- input wiring ---------------- */
function evPoint(e){ return {x:e.clientX, y:e.clientY}; }
canvas.addEventListener("pointerdown", e=>{
  e.preventDefault();
  try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
  unlockAudio();
  const p=evPoint(e);
  if(hitButtons(p)) return;
  if(scene && scene.onDown) scene.onDown(p);
}, {passive:false});
canvas.addEventListener("pointermove", e=>{
  e.preventDefault();
  if(scene && scene.onMove) scene.onMove(evPoint(e));
}, {passive:false});
canvas.addEventListener("pointerup", e=>{
  e.preventDefault();
  if(scene && scene.onUp) scene.onUp(evPoint(e));
}, {passive:false});
canvas.addEventListener("pointercancel", e=>{
  if(scene && scene.onUp) scene.onUp(evPoint(e));
});
canvas.addEventListener("contextmenu", e=>e.preventDefault());

/* ---------------- main loop ---------------- */
let lastT=performance.now();
function frame(now){
  const dt=clamp((now-lastT)/1000, 0, 0.05);
  lastT=now;
  buttons=[];
  ctx.save();
  if(shake>0){
    ctx.translate(rand(-shake,shake), rand(-shake,shake));
  }
  try{
    if(scene && scene.draw) scene.draw(dt);
  }catch(err){
    ctx.restore();
    ctx.fillStyle=COL.bg; ctx.fillRect(0,0,W,H);
    txt("Oops! Tap to restart.", W/2, H/2, 22, COL.text);
    buttons=[{x:0,y:0,w:W,h:H,cb:()=>go("home")}];
    requestAnimationFrame(frame);
    return;
  }
  ctx.restore();
  requestAnimationFrame(frame);
}

/* expose a tiny debug handle (harmless in production) */
window.__tg = {go, scenes, get state(){return S;}, get shake(){return shake;}};

go(S.intro? "home" : "intro");
requestAnimationFrame(frame);
</script>
